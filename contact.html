<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>


<style>
    .contact {
    text-align: center;
    padding: 40px;
    background-color: pink;
}

.contact h2 {
    color: darkblue;
    font-size: 30px;
}

.contact form {
    max-width: 400px;
    margin: auto;
}

.contact input,
.contact textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid wheat;
    border-radius: 8px;
    box-sizing: border-box;
}

.contact button {
    background-color: wheat;
    color: darkblue;
    padding: 10px 25px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

.contact button:hover {
    background-color: #333;
}
button{
    background-color: darkblue;
    color: wheat;
    text-align: end;
    font-family: Arial, Helvetica, sans-serif;
    border-radius: 30px;
    padding: 18px;
    
}
</style>
<body>
           <a href="index.html">
    <button type="button"><-Continue To Shopping</button></a>
    <section class="contact">
    <h2>Contact Us</h2>
    <p>Have any questions? Contact us!</p>

    <form>
        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <input type="text" placeholder="product Inquiry">

        <textarea placeholder="your doubt"></textarea>

        <button type="submit">Send Message</button>
    </form>
</section>
</body>
</html>
